<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <script>
      // bookcleaning.app is the canonical domain: forward visits from the
      // *.replit.app deployment URL there, preserving the full path.
      (function () {
        var h = window.location.hostname;
        if (h.endsWith(".replit.app")) {
          window.location.replace(
            "https://bookcleaning.app" +
              window.location.pathname +
              window.location.search +
              window.location.hash,
          );
        }
      })();
    </script>
