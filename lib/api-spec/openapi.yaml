openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: 833 Tidyups Booking API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bookings
    description: Booking operations
  - name: stats
    description: Dashboard statistics
  - name: staff
    description: Staff management
  - name: contact
    description: Public contact form
  - name: social
    description: Social media links shown in the site footer

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /contact:
    post:
      operationId: submitContactMessage
      tags: [contact]
      summary: Submit a contact form message (public, no auth)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessageInput"
      responses:
        "201":
          description: Message received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMessage"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /contact/messages:
    get:
      operationId: listContactMessages
      tags: [contact]
      summary: List contact form messages (dispatcher only), newest first
      responses:
        "200":
          description: Contact messages, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactMessage"

  /contact/messages/{id}:
    patch:
      operationId: updateContactMessage
      tags: [contact]
      summary: Mark a contact message handled or unhandled (dispatcher only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessageStatusUpdate"
      responses:
        "200":
          description: Updated contact message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteContactMessage
      tags: [contact]
      summary: Delete a contact message (dispatcher only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Message deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /social-links:
    get:
      operationId: listSocialLinks
      tags: [social]
      summary: List social media links (public, no auth)
      responses:
        "200":
          description: Social links ordered for display
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SocialLink"

    post:
      operationId: createSocialLink
      tags: [social]
      summary: Add a social media link (dispatcher only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialLinkInput"
      responses:
        "201":
          description: Link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialLink"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /social-links/{id}:
    patch:
      operationId: updateSocialLink
      tags: [social]
      summary: Update a social media link (dispatcher only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialLinkUpdate"
      responses:
        "200":
          description: Updated link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialLink"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteSocialLink
      tags: [social]
      summary: Delete a social media link (dispatcher only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Link deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List all bookings
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, confirmed, in_progress, completed, cancelled]
        - in: query
          name: staffId
          schema:
            type: number
        - in: query
          name: date
          schema:
            type: string
            description: Filter by scheduled date (YYYY-MM-DD)
        - in: query
          name: limit
          schema:
            type: number
            default: 50
        - in: query
          name: offset
          schema:
            type: number
            default: 0
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"

    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a new booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/stats:
    get:
      operationId: getBookingStats
      tags: [stats]
      summary: Get booking dashboard stats
      responses:
        "200":
          description: Booking stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingStats"

  /bookings/upcoming:
    get:
      operationId: getUpcomingBookings
      tags: [bookings]
      summary: Get upcoming bookings (next 14 days)
      responses:
        "200":
          description: Upcoming bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get a single booking
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateBooking
      tags: [bookings]
      summary: Update a booking
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingUpdate"
      responses:
        "200":
          description: Booking updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteBooking
      tags: [bookings]
      summary: Cancel/delete a booking
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Booking deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List all staff members
      parameters:
        - in: query
          name: activeOnly
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: List of staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Staff"

    post:
      operationId: createStaff
      tags: [staff]
      summary: Create a new staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInput"
      responses:
        "201":
          description: Staff member created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /staff/me:
    get:
      operationId: getStaffMe
      tags: [staff]
      summary: Get the staff record linked to the authenticated Clerk account
      responses:
        "200":
          description: Staff record for the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
        "404":
          description: No staff record is linked to this Clerk account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /staff/{id}:
    patch:
      operationId: updateStaff
      tags: [staff]
      summary: Update a staff member
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUpdate"
      responses:
        "200":
          description: Staff member updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /staff/{id}/schedule:
    get:
      operationId: getStaffSchedule
      tags: [staff]
      summary: Get a staff member's bookings for a given date
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
        - in: query
          name: date
          required: true
          schema:
            type: string
            description: Date in YYYY-MM-DD format
      responses:
        "200":
          description: Staff schedule for the date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /staff/{id}/location:
    post:
      operationId: postStaffLocation
      tags: [staff]
      summary: Post cleaner's live GPS location
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat:
                  type: number
                lng:
                  type: number
                accuracy:
                  type: number
      responses:
        "200":
          description: Location recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /schedule:
    get:
      operationId: getDaySchedule
      tags: [staff]
      summary: Get all staff schedules for a given date
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            description: Date in YYYY-MM-DD format
      responses:
        "200":
          description: All staff schedules for the date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffDaySchedule"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ContactMessage:
      type: object
      required: [id, name, email, message, createdAt, handledAt]
      properties:
        id:
          type: number
          format: int32
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        handledAt:
          type: ["string", "null"]
          format: date-time

    ContactMessageStatusUpdate:
      type: object
      required: [handled]
      properties:
        handled:
          type: boolean

    ContactMessageInput:
      type: object
      required: [name, email, message]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
          maxLength: 320
        phone:
          type: string
          maxLength: 40
        message:
          type: string
          minLength: 1
          maxLength: 5000
        website:
          description: Honeypot field — must be left empty. Bots that fill it are rejected.
          type: string
          maxLength: 200

    Booking:
      type: object
      required:
        - id
        - firstName
        - lastName
        - phone
        - address
        - city
        - serviceType
        - bedrooms
        - bathrooms
        - scheduledDate
        - scheduledTime
        - frequency
        - status
        - createdAt
      properties:
        id:
          type: number
          format: int32
        staffId:
          type: ["number", "null"]
          format: int32
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        address:
          type: string
        city:
          type: string
        province:
          type: string
        postalCode:
          type: ["string", "null"]
        serviceType:
          type: string
          enum: [standard_clean, deep_clean, move_in_out, move_in, move_out, post_construction]
        bedrooms:
          type: number
          format: int32
        bathrooms:
          type: number
          format: int32
        extras:
          type: array
          items:
            type: string
        scheduledDate:
          type: string
          description: Date in YYYY-MM-DD format
        scheduledTime:
          type: string
          description: Time in HH:MM format
        frequency:
          type: string
          enum: [one_time, weekly, biweekly, monthly]
        estimatedPrice:
          type: ["number", "null"]
        priceBreakdown:
          oneOf:
            - $ref: "#/components/schemas/PriceBreakdown"
            - type: "null"
          description: Itemized quote breakdown recorded at booking creation. Null for older bookings.
        notes:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, confirmed, in_progress, completed, cancelled]
        jobberJobId:
          type: ["string", "null"]
        jobberSyncStatus:
          type: string
          enum: [not_started, pending, synced, failed]
          description: >
            Jobber sync state. not_started = never attempted, pending = in
            progress, synced = succeeded, failed = error (see jobberSyncError).
        jobberSyncError:
          type: ["string", "null"]
          description: Error message from the last failed Jobber sync attempt.
        addressLat:
          type: ["number", "null"]
          format: float
          description: Latitude from Google Places autocomplete, if captured.
        addressLng:
          type: ["number", "null"]
          format: float
          description: Longitude from Google Places autocomplete, if captured.
        createdAt:
          type: string
          format: date-time
        hasTranscript:
          type: boolean
          description: True when at least one call transcript is attached to this booking.

    PriceBreakdown:
      type: object
      description: >
        Itemized breakdown of how a quoted price was built: hours × rate,
        each discount applied, and the fuel surcharge.
      required: [total]
      properties:
        hours:
          type: number
          description: Hours of cleaning quoted.
        hourlyRate:
          type: number
          description: Hourly rate used ($52.50 one cleaner, $105 two cleaners, or custom).
        baseAmount:
          type: number
          description: hours × hourlyRate before discounts.
        manualPrice:
          type: number
          description: >
            Manually entered quoted price before discounts, recorded instead of
            hours/hourlyRate/baseAmount when the dispatcher typed the price
            directly rather than deriving it from hours × rate.
        leadSource:
          type: ["string", "null"]
          description: Where the customer heard about us, if recorded.
        leadDiscount:
          type: number
          description: Lead-source thank-you discount amount ($10 when applied).
        quickDiscountTens:
          type: number
          description: Number of −$10 quick discounts applied.
        quickDiscountTwenties:
          type: number
          description: Number of −$20 quick discounts applied.
        loyaltyDiscount:
          type: number
          description: Dollar amount of the 10% loyalty discount, if applied.
        fuelSurcharge:
          type: number
          description: Fuel surcharge added to the quote.
        total:
          # Required — see the `required` list below; the API also verifies
          # that the itemized lines reconcile to this total server-side.
          type: number
          description: Final quoted price including the fuel surcharge.

    BookingInput:
      type: object
      required:
        - firstName
        - lastName
        - phone
        - address
        - city
        - serviceType
        - bedrooms
        - bathrooms
        - scheduledDate
        - scheduledTime
        - frequency
      properties:
        staffId:
          type: number
          format: int32
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 7
        email:
          type: string
        address:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        province:
          type: string
          default: "AB"
        postalCode:
          type: string
        serviceType:
          type: string
          enum: [standard_clean, deep_clean, move_in_out, move_in, move_out, post_construction]
        bedrooms:
          type: number
          format: int32
          minimum: 0
          maximum: 10
        bathrooms:
          type: number
          format: int32
          minimum: 1
          maximum: 10
        extras:
          type: array
          items:
            type: string
          default: []
        scheduledDate:
          type: string
        scheduledTime:
          type: string
        frequency:
          type: string
          enum: [one_time, weekly, biweekly, monthly]
        estimatedPrice:
          type: number
        priceBreakdown:
          $ref: "#/components/schemas/PriceBreakdown"
        notes:
          type: string
        status:
          type: string
          enum: [pending, confirmed, in_progress, completed, cancelled]
          default: pending
        callTranscript:
          type: string
          description: Full transcript of the inbound call that generated this booking.
        addressLat:
          type: number
          format: float
          description: Latitude from Google Places autocomplete, stored at booking creation.
        addressLng:
          type: number
          format: float
          description: Longitude from Google Places autocomplete, stored at booking creation.

    BookingUpdate:
      type: object
      properties:
        staffId:
          type: number
          format: int32
          nullable: true
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        email:
          type: string
          nullable: true
        address:
          type: string
        city:
          type: string
        province:
          type: string
        postalCode:
          type: string
          nullable: true
        serviceType:
          type: string
          enum: [standard_clean, deep_clean, move_in_out, move_in, move_out, post_construction]
        bedrooms:
          type: number
        bathrooms:
          type: number
        extras:
          type: array
          items:
            type: string
        scheduledDate:
          type: string
        scheduledTime:
          type: string
        frequency:
          type: string
          enum: [one_time, weekly, biweekly, monthly]
        estimatedPrice:
          type: number
          nullable: true
        priceBreakdown:
          oneOf:
            - $ref: "#/components/schemas/PriceBreakdown"
            - type: "null"
          description: >
            Itemized quote breakdown. Send null to clear it (e.g. when the
            quoted price is edited and the old itemization no longer applies).
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, confirmed, in_progress, completed, cancelled]
        jobberJobId:
          type: string
        addressLat:
          type: number
          format: float
          nullable: true
          description: Latitude from Google Places autocomplete.
        addressLng:
          type: number
          format: float
          nullable: true
          description: Longitude from Google Places autocomplete.

    BookingStats:
      type: object
      required:
        - totalBookings
        - upcomingCount
        - completedCount
        - pendingCount
        - cancelledCount
        - totalRevenue
        - thisWeekCount
        - thisMonthCount
      properties:
        totalBookings:
          type: number
        upcomingCount:
          type: number
        completedCount:
          type: number
        pendingCount:
          type: number
        cancelledCount:
          type: number
        totalRevenue:
          type: number
        thisWeekCount:
          type: number
        thisMonthCount:
          type: number

    Staff:
      type: object
      required:
        - id
        - name
        - role
        - active
        - createdAt
      properties:
        id:
          type: number
          format: int32
        name:
          type: string
        role:
          type: string
          enum: [cleaner, lead_cleaner, supervisor]
        phone:
          type: ["string", "null"]
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    StaffInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        role:
          type: string
          enum: [cleaner, lead_cleaner, supervisor]
          default: cleaner
        phone:
          type: string
        active:
          type: boolean
          default: true

    StaffUpdate:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum: [cleaner, lead_cleaner, supervisor]
        phone:
          type: string
        active:
          type: boolean
        clerkUserId:
          type: string
          nullable: true
          description: >
            Clerk user ID to link to this staff record. Dispatcher-only field.
            Set to null to unlink. When set, the staff member can sign in to the
            cleaner app and their schedule will load automatically.
        homeAddress:
          type: string
          nullable: true
          description: Street address for the cleaner's home base (used for map proximity).
        homeLat:
          type: number
          nullable: true
          description: Latitude of the home address.
        homeLng:
          type: number
          nullable: true
          description: Longitude of the home address.

    StaffDaySchedule:
      type: object
      required:
        - staff
        - bookings
      properties:
        staff:
          $ref: "#/components/schemas/Staff"
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"

    SocialLink:
      type: object
      required: [id, platform, label, url, sortOrder]
      properties:
        id:
          type: number
          format: int32
        platform:
          type: string
          description: Machine key used to pick the icon, e.g. "facebook".
        label:
          type: string
        url:
          type: string
          description: Empty string hides the link from the public footer.
        sortOrder:
          type: number
          format: int32

    SocialLinkInput:
      type: object
      required: [label, url]
      properties:
        platform:
          type: string
          description: Optional machine key; derived from the label when omitted.
        label:
          type: string
          minLength: 1
        url:
          type: string
        sortOrder:
          type: number
          format: int32

    SocialLinkUpdate:
      type: object
      properties:
        label:
          type: string
          minLength: 1
        url:
          type: string
        sortOrder:
          type: number
          format: int32
