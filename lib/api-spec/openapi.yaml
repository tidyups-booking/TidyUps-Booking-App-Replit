openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: 833 Tidyups Booking API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bookings
    description: Booking operations
  - name: stats
    description: Dashboard statistics
  - name: staff
    description: Staff management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List all bookings
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, confirmed, in_progress, completed, cancelled]
        - in: query
          name: staffId
          schema:
            type: number
        - in: query
          name: date
          schema:
            type: string
            description: Filter by scheduled date (YYYY-MM-DD)
        - in: query
          name: limit
          schema:
            type: number
            default: 50
        - in: query
          name: offset
          schema:
            type: number
            default: 0
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"

    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a new booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/stats:
    get:
      operationId: getBookingStats
      tags: [stats]
      summary: Get booking dashboard stats
      responses:
        "200":
          description: Booking stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingStats"

  /bookings/upcoming:
    get:
      operationId: getUpcomingBookings
      tags: [bookings]
      summary: Get upcoming bookings (next 14 days)
      responses:
        "200":
          description: Upcoming bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get a single booking
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateBooking
      tags: [bookings]
      summary: Update a booking
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingUpdate"
      responses:
        "200":
          description: Booking updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteBooking
      tags: [bookings]
      summary: Cancel/delete a booking
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Booking deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List all staff members
      parameters:
        - in: query
          name: activeOnly
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: List of staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Staff"

    post:
      operationId: createStaff
      tags: [staff]
      summary: Create a new staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInput"
      responses:
        "201":
          description: Staff member created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /staff/{id}:
    patch:
      operationId: updateStaff
      tags: [staff]
      summary: Update a staff member
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUpdate"
      responses:
        "200":
          description: Staff member updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /staff/{id}/schedule:
    get:
      operationId: getStaffSchedule
      tags: [staff]
      summary: Get a staff member's bookings for a given date
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
        - in: query
          name: date
          required: true
          schema:
            type: string
            description: Date in YYYY-MM-DD format
      responses:
        "200":
          description: Staff schedule for the date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /schedule:
    get:
      operationId: getDaySchedule
      tags: [staff]
      summary: Get all staff schedules for a given date
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            description: Date in YYYY-MM-DD format
      responses:
        "200":
          description: All staff schedules for the date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffDaySchedule"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Booking:
      type: object
      required:
        - id
        - firstName
        - lastName
        - phone
        - address
        - city
        - serviceType
        - bedrooms
        - bathrooms
        - scheduledDate
        - scheduledTime
        - frequency
        - status
        - createdAt
      properties:
        id:
          type: number
          format: int32
        staffId:
          type: ["number", "null"]
          format: int32
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        address:
          type: string
        city:
          type: string
        province:
          type: string
        postalCode:
          type: ["string", "null"]
        serviceType:
          type: string
          enum: [standard_clean, deep_clean, move_in_out, post_construction]
        bedrooms:
          type: number
          format: int32
        bathrooms:
          type: number
          format: int32
        extras:
          type: array
          items:
            type: string
        scheduledDate:
          type: string
          description: Date in YYYY-MM-DD format
        scheduledTime:
          type: string
          description: Time in HH:MM format
        frequency:
          type: string
          enum: [one_time, weekly, biweekly, monthly]
        estimatedPrice:
          type: ["number", "null"]
        notes:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, confirmed, in_progress, completed, cancelled]
        jobberJobId:
          type: ["string", "null"]
        jobberSyncStatus:
          type: string
          enum: [not_started, pending, synced, failed]
          description: >
            Jobber sync state. not_started = never attempted, pending = in
            progress, synced = succeeded, failed = error (see jobberSyncError).
        jobberSyncError:
          type: ["string", "null"]
          description: Error message from the last failed Jobber sync attempt.
        createdAt:
          type: string
          format: date-time
        hasTranscript:
          type: boolean
          description: True when at least one call transcript is attached to this booking.

    BookingInput:
      type: object
      required:
        - firstName
        - lastName
        - phone
        - address
        - city
        - serviceType
        - bedrooms
        - bathrooms
        - scheduledDate
        - scheduledTime
        - frequency
      properties:
        staffId:
          type: number
          format: int32
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 7
        email:
          type: string
        address:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        province:
          type: string
          default: "AB"
        postalCode:
          type: string
        serviceType:
          type: string
          enum: [standard_clean, deep_clean, move_in_out, post_construction]
        bedrooms:
          type: number
          format: int32
          minimum: 0
          maximum: 10
        bathrooms:
          type: number
          format: int32
          minimum: 1
          maximum: 10
        extras:
          type: array
          items:
            type: string
          default: []
        scheduledDate:
          type: string
        scheduledTime:
          type: string
        frequency:
          type: string
          enum: [one_time, weekly, biweekly, monthly]
        estimatedPrice:
          type: number
        notes:
          type: string
        status:
          type: string
          enum: [pending, confirmed, in_progress, completed, cancelled]
          default: pending
        callTranscript:
          type: string
          description: Full transcript of the inbound call that generated this booking.
        addressLat:
          type: number
          format: float
          description: Latitude from Google Places autocomplete, stored at booking creation.
        addressLng:
          type: number
          format: float
          description: Longitude from Google Places autocomplete, stored at booking creation.

    BookingUpdate:
      type: object
      properties:
        staffId:
          type: number
          format: int32
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        city:
          type: string
        province:
          type: string
        postalCode:
          type: string
        serviceType:
          type: string
          enum: [standard_clean, deep_clean, move_in_out, post_construction]
        bedrooms:
          type: number
        bathrooms:
          type: number
        extras:
          type: array
          items:
            type: string
        scheduledDate:
          type: string
        scheduledTime:
          type: string
        frequency:
          type: string
          enum: [one_time, weekly, biweekly, monthly]
        estimatedPrice:
          type: number
        notes:
          type: string
        status:
          type: string
          enum: [pending, confirmed, in_progress, completed, cancelled]
        jobberJobId:
          type: string

    BookingStats:
      type: object
      required:
        - totalBookings
        - upcomingCount
        - completedCount
        - pendingCount
        - cancelledCount
        - totalRevenue
        - thisWeekCount
        - thisMonthCount
      properties:
        totalBookings:
          type: number
        upcomingCount:
          type: number
        completedCount:
          type: number
        pendingCount:
          type: number
        cancelledCount:
          type: number
        totalRevenue:
          type: number
        thisWeekCount:
          type: number
        thisMonthCount:
          type: number

    Staff:
      type: object
      required:
        - id
        - name
        - role
        - active
        - createdAt
      properties:
        id:
          type: number
          format: int32
        name:
          type: string
        role:
          type: string
          enum: [cleaner, lead_cleaner, supervisor]
        phone:
          type: ["string", "null"]
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    StaffInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        role:
          type: string
          enum: [cleaner, lead_cleaner, supervisor]
          default: cleaner
        phone:
          type: string
        active:
          type: boolean
          default: true

    StaffUpdate:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum: [cleaner, lead_cleaner, supervisor]
        phone:
          type: string
        active:
          type: boolean

    StaffDaySchedule:
      type: object
      required:
        - staff
        - bookings
      properties:
        staff:
          $ref: "#/components/schemas/Staff"
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
